<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>DBE Verification Portal</title>

  <!-- Only MediaPipe Face Detection is needed -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h2 { margin: 0 0 8px; font-size: 1.25rem; font-weight: 600; }
    p { margin: 0 0 24px; font-size: 0.9rem; color: #94a3b8; }
    .btn {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-stop {
      background: #dc2626;
      margin-top: 12px;
    }
    .btn-done {
      background: #10b981;
      margin-top: 16px;
    }
    .status {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #38bdf8;
      min-height: 24px;
    }
    #canvasPreview {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 16px;
      background: #000;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <h2>DBE Secure Capture</h2>
    <p>Hardware-locked live audit verification</p>

    <video id="videoFeed" playsinline muted autoplay style="display:none;"></video>
    <canvas id="canvasPreview"></canvas>

    <button id="actionBtn" class="btn" onclick="startCapture()">Start Blurred Recording</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    var urlParams = new URLSearchParams(window.location.search);
    var auditId = urlParams.get('auditId') || '';
    var currentLat = '', currentLng = '';

    var videoElement = document.getElementById('videoFeed');
    var canvasElement = document.getElementById('canvasPreview');
    var canvasCtx = canvasElement.getContext('2d');
    var actionBtn = document.getElementById('actionBtn');
    var statusText = document.getElementById('status');

    var mediaStream = null;
    var mediaRecorder = null;
    var recordedChunks = [];
    var isRecording = false;

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(pos) {
        currentLat = pos.coords.latitude;
        currentLng = pos.coords.longitude;
      }, function() {}, { enableHighAccuracy: true });
    }

    function exitPortal() {
      window.close();
      history.back();
    }

    var faceDetection = new FaceDetection({
      locateFile: function(file) {
        return "https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/" + file;
      }
    });

    faceDetection.setOptions({
      model: 'short',
      minDetectionConfidence: 0.5
    });

    faceDetection.onResults(function(results) {
      if (!canvasElement.width && videoElement.videoWidth) {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
      }

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.detections && results.detections.length > 0) {
        for (var i = 0; i < results.detections.length; i++) {
          var box = results.detections[i].boundingBox;
          var w = box.width * canvasElement.width;
          var h = box.height * canvasElement.height;
          var x = (box.xCenter * canvasElement.width) - (w / 2);
          var y = (box.yCenter * canvasElement.height) - (h / 2);

          var padX = w * 0.15;
          var padY = h * 0.20;

          canvasCtx.save();
          canvasCtx.beginPath();
          canvasCtx.rect(x - padX, y - padY, w + (padX * 2), h + (padY * 2));
          canvasCtx.clip();
          canvasCtx.filter = 'blur(18px)';
          canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
          canvasCtx.restore();
        }
      }
      canvasCtx.restore();
    });

    async function frameProcessingLoop() {
      if (!isRecording) return;
      if (videoElement.readyState >= 2) {
        await faceDetection.send({ image: videoElement });
      }
      if ('requestVideoFrameCallback' in videoElement) {
        videoElement.requestVideoFrameCallback(frameProcessingLoop);
      } else {
        requestAnimationFrame(frameProcessingLoop);
      }
    }

    async function startCapture() {
      try {
        statusText.innerText = "Initialising privacy camera...";
        actionBtn.disabled = true;

        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });

        videoElement.srcObject = mediaStream;
        await videoElement.play();

        canvasElement.width = videoElement.videoWidth || 640;
        canvasElement.height = videoElement.videoHeight || 480;
        canvasElement.style.display = 'block';

        isRecording = true;
        frameProcessingLoop();

        var canvasStream = canvasElement.captureStream(25);
        var mimeType = '';

        if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) {
          mimeType = 'video/webm;codecs=vp8';
        } else if (MediaRecorder.isTypeSupported('video/webm')) {
          mimeType = 'video/webm';
        } else if (MediaRecorder.isTypeSupported('video/mp4')) {
          mimeType = 'video/mp4';
        }

        recordedChunks = [];
        mediaRecorder = new MediaRecorder(canvasStream, mimeType ? { mimeType: mimeType } : {});

        mediaRecorder.ondataavailable = function(e) {
          if (e.data && e.data.size > 0) {
            recordedChunks.push(e.data);
          }
        };

        mediaRecorder.onstop = uploadRecordedVideo;
        mediaRecorder.start();

        actionBtn.innerText = "Stop & Submit Video";
        actionBtn.className = "btn btn-stop";
        actionBtn.disabled = false;
        actionBtn.onclick = stopCapture;
        statusText.innerText = "Recording... Faces are automatically blurred.";

      } catch (err) {
        statusText.innerText = "Error accessing camera: " + err.message;
        actionBtn.disabled = false;
        if (mediaStream) {
          mediaStream.getTracks().forEach(function(t) { t.stop(); });
        }
      }
    }

    function stopCapture() {
      isRecording = false;
      actionBtn.style.display = 'none';
      statusText.innerText = "Encrypting and uploading verification...";

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }

      if (mediaStream) {
        mediaStream.getTracks().forEach(function(t) { t.stop(); });
      }
    }

    function uploadRecordedVideo() {
      var blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
      var reader = new FileReader();

      reader.onload = function(e) {
        var payload = {
          auditId: auditId,
          video: e.target.result,
          lat: currentLat,
          lng: currentLng
        };

        fetch("https://script.google.com/macros/s/AKfycbywLtQ-gTIr82XA--hspitdQH903URzyZrV3a80LQjlX2asUG-xyNoewgHoYYNUG8TZ/exec", {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        })
        .then(function() {
          document.getElementById('mainCard').innerHTML = 
            '<h2>Verification Complete</h2>' +
            '<p style="color:#10b981; font-weight:600;">Media and GPS secured.</p>' +
            '<button class="btn btn-done" onclick="exitPortal()">Return to App</button>';
          setTimeout(function() {
            exitPortal();
          }, 1500);
        })
        .catch(function() {
          actionBtn.style.display = 'block';
          actionBtn.className = "btn";
          actionBtn.innerText = "Record Live Video";
          actionBtn.onclick = startCapture;
          statusText.innerText = "Upload failed. Please record again.";
        });
      };

      reader.readAsDataURL(blob);
    }
  </script>
</body>
</html>
